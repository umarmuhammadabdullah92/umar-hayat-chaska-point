<!DOCTYPE html>
<!--
  The 1200x630 share card, as a source rather than a binary.

  A link to the site on WhatsApp, Facebook or X renders this. 1200x630 is
  the size every one of those platforms asks for, and it is the reason a
  card has to be built rather than cropped: the trimmed logo is 426x278,
  which is a quarter of the width it gets shown at, and shows as a blurred
  stamp in the corner of a thumbnail.

  It is generated by tools/make-share-image.py, which renders this file in
  headless Chrome and writes img/social.png. It is NOT a photograph of the
  room or the food, and a real photograph should replace it -- drop
  img/social.jpg in and rebuild, and the build picks it up in preference
  to this one without any other change. See img/README.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Display';font-weight:700;font-display:block;
    src:url('file:///home/abdullah/Desktop/Umar Hayat Chaska Point /fonts/display-700.woff2') format('woff2');}
  @font-face{font-family:'Body';font-weight:400;font-display:block;
    src:url('file:///home/abdullah/Desktop/Umar Hayat Chaska Point /fonts/body-400.woff2') format('woff2');}

  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
  body{
    background:#0B0907;
    color:#F2EAD9;
    font-family:'Body',sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 96px;
    /* The warm floor of the page, sampled from the room's own palette,
       so the card sits in the same light as the site it links to. */
    box-shadow:inset 0 0 0 1px rgba(221,196,145,.22), inset 0 -220px 160px -160px rgba(221,196,145,.10);
  }
  .rule{width:96px;height:3px;background:#DDC491;margin-bottom:38px}
  h1{
    font-family:'Display',Georgia,serif;font-weight:700;
    font-size:82px;line-height:1.02;letter-spacing:-.015em;
    margin:0;color:#F2EAD9;max-width:15ch;
  }
  .tag{
    font-size:30px;line-height:1.4;color:#DDC491;margin-top:26px;
    letter-spacing:.005em;
  }
  .foot{
    display:flex;align-items:baseline;gap:16px;
    margin-top:54px;font-size:21px;letter-spacing:.22em;
    text-transform:uppercase;color:rgba(242,234,217,.58);
  }
  .foot .est{color:#B08D57}
</style>
</head>
<body>
  <div class="rule"></div>
  <h1>Umar Hayat<br>Chaska Point</h1>
  <p class="tag">Charcoal Grill &amp; Nashta House</p>
  <p class="foot"><span>Sahiwal</span><span class="est">&mdash;</span><span>Est. 1974</span></p>
</body>
</html>
